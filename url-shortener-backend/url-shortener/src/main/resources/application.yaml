spring:
  application:
    name: url-shortener

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

  frontend:
    url: ${FRONTEND_URL}
